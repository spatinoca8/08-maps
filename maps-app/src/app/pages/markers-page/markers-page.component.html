<div #map1 class="h-[60vh] lg:h-[calc(100vh-64px)]"></div>
<section class="h-[40vh] lg:fixed lg:top-20 left-3 right-3 lg:left-10 lg:right-auto lg:w-[260px]  bg-white lg:rounded p-3 sm:p-5 overflow-y-scroll">
    <h2 class="text-xl font-bold text-black mb-2">Marcadores</h2>

    <div class="flex flex-col gap-2">
        @for (marker of markers(); track marker.id) {
            <div class="form-control">
            <label class="label cursor-pointer justify-between gap-2"
                (click)="flyToMarker(marker.mapboxMarker.getLngLat())"
                (dblclick)="deleteMarker(marker); $event.stopPropagation()">
                <span class="label-text max-w-[75%] text-[10px] leading-tight whitespace-normal break-words sm:max-w-[180px] sm:text-xs md:text-sm text-black
                ">
                    {{marker.mapboxMarker.getLngLat() | json}}
                </span>
                <input type="radio"
                 name="radio-10"
                checked="checked"
                 class="radio"
                 [style]="{backgroundColor: marker.mapboxMarker._color}" />
            </label>
        </div>
        }@empty{
            <div class="flex justify-center items-center bg-blue-100 rounded py-5">
                <p class="text-xs text-secondary">
                    No hay marcadores
                </p>
            </div>
        }
       
       


    </div>
</section>
